<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email confirmation</title>
  </head>
  <body style="font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height:1.5; color:#111827;">
    <p style="margin:0 0 12px;">Hello from <strong>shuttlex.com</strong>!</p>

    <p style="margin:0 0 12px;">
      You're receiving this email because user <strong>{{ user_display }}</strong> has given your email address to
      register an account on shuttlex.com.
    </p>

    <p style="margin:0 0 12px;">
      To confirm this is correct, click <a href="{{ activate_url }}" style="color:#2563eb; text-decoration:underline;">Here</a>.
    </p>

    <p style="margin:24px 0 0; color:#6b7280;">If you did not request this, you can ignore this email.</p>
  </body>
</html>

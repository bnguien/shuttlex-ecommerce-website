<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url=http://localhost:5173/reset-password/{{ uid }}/{{ token }}">
  <title>Resetting your password…</title>
  <style>
    body {font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; margin: 2rem;}
    .card {max-width: 640px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.5rem;}
    .muted {color: #6b7280}
  </style>
</head>
<body>
  <div class="card">
    <h2>Resetting your password…</h2>
    <p class="muted">Redirecting you to set a new password...</p>
    <p class="muted">If you are not redirected, <a href="http://localhost:5173/reset-password/{{ uid }}/{{ token }}">click here</a>.</p>
  </div>
  <script>
    window.location.href = "http://localhost:5173/reset-password/{{ uid|escapejs }}/{{ token|escapejs }}";
  </script>
</body>
</html>
